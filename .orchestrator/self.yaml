# Orchestrator self-management configuration
orchestrator:
  version: 0.1.0
  name: repo-orchestrator
  description: Multi-repository orchestration system
  
  bootstrap:
    initialized: true
    timestamp: 2024-01-15T00:00:00Z
    hooks:
      - name: pre-commit
        action: validate-config
        enabled: true
      - name: post-commit
        action: sync-version
        enabled: true
      - name: pre-push
        action: dependency-check
        enabled: true
  
  self-management:
    versioning:
      strategy: semver
      auto-bump: patch
      trigger: commit-message
      
    auto-update:
      enabled: true
      check-interval: daily
      auto-merge: false
    
    workflows:
      - name: self-update
        on: 
          - push
          - workflow_dispatch
        jobs:
          - validate-orchestration
          - update-dependencies
          - sync-configurations
          - run-tests
      
      - name: health-monitor
        on:
          - schedule
        schedule: "0 9 * * 1"
        jobs:
          - collect-metrics
          - generate-report
          - create-alerts
  
  monitoring:
    metrics:
      collect: true
      interval: hourly
      retention-days: 90
    
    alerts:
      enabled: true
      channels:
        - type: github-issues
          enabled: true
        - type: email
          enabled: false
      
      thresholds:
        health-score: 70
        stale-branches: 10
        dependency-drift: 5
        inactive-days: 30
  
  features:
    cross-repo-epics: true
    dependency-management: true
    coordinated-releases: true
    emergency-rollback: true
    branch-sync: true
    health-monitoring: true
  
  providers:
    default: github
    supported:
      - github
      - gitlab
      - gitea
  
  plugins:
    enabled: false
    directory: .orchestrator/plugins
    auto-load: false