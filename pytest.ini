[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=octo
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    requires_git: Tests that require git
    requires_network: Tests that require network access

# Timeout for tests
timeout = 30

# Logging
log_cli = true
log_cli_level = INFO